version: '3.8'

services:
  db:
    image: mariadb:10.6
    container_name: medicore_db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: hospital_management
    ports:
      - "3306:3306"
    volumes:
      - db_data_v2:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    image: himashachinthani/hospital-management-backend:latest
    container_name: medicore_backend
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=root
      - DB_NAME=hospital_management
      - APP_ENV=prod
    ports:
      - "8081:8081"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    image: himashachinthani/hospital-management-frontend:latest
    container_name: medicore_frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  db_data_v2:
